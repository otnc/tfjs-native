name: 🐛 Bug Report
description: Report an issue that should be fixed
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a bug report. It helps make tfjs-native better.

        Please try to include as much information as possible.
  - type: input
    attributes:
      label: What version of tfjs-native are you using?
      placeholder: 0.0.0
    validations:
      required: true
  - type: input
    attributes:
      label: What version of libtensorflow are you using?
      description: The default pinned version, or the one set via TFJS_NATIVE_LIBTENSORFLOW_VERSION / LIBTENSORFLOW_ROOT.
      placeholder: 2.10.0 (default)
    validations:
      required: true
  - type: input
    attributes:
      label: What runtime/platform is your app running on? (with version if possible)
      placeholder: Node.js 22 on Windows 11, Bun 1.3 on Ubuntu 24.04, etc.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What steps can reproduce the bug?
      description: Explain the bug and provide a code snippet that can reproduce it.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What is the expected behavior?
  - type: textarea
    attributes:
      label: What do you see instead?
  - type: textarea
    attributes:
      label: Additional information
      description: Is there anything else you think we should know?
