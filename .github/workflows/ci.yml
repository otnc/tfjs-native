name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback: lint/typecheck/pure tests, no native toolchain needed.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      TFJS_NATIVE_SKIP_INSTALL: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Biome check (src/, scripts/, configs — lint + format)
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      # Native-dependent tests skip themselves without a built addon.
      - name: Test (pure)
        run: bun test

  # Builds the addon against libtensorflow and runs the native integration tests.
  # macos-15-intel is intentional: the official libtensorflow C library has no arm64
  # build, so macos-latest (arm64) cannot link it.
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # node-gyp needs a real Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # bun run build:native (scripts/build-native.mjs) resolves its own
      # Python via uv (uv is a required prerequisite — see docs/RULES.md /
      # CONTRIBUTING.md), so no separate Python setup step is needed here.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - run: bun install --frozen-lockfile
        env:
          TFJS_NATIVE_SKIP_INSTALL: "1"

      - name: Cache libtensorflow
        uses: actions/cache@v6
        with:
          path: deps/libtensorflow
          key: libtensorflow-${{ runner.os }}-${{ hashFiles('scripts/install.mjs') }}

      - name: Fetch libtensorflow
        run: node scripts/install.mjs

      # Exercises the real contributor/release command, not a bypass, so CI
      # actually validates it (see scripts/build-native.mjs).
      - name: Build addon
        run: bun run build:native

      - name: Test (with native addon)
        run: bun test

  cpp-format:
    name: cpp-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # uv provides uvx, which runs the pinned clang-format (see check:cpp).
      # No Python dependencies here, so uv's dependency cache has nothing to key on.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - uses: oven-sh/setup-bun@v2

      - name: Check C++ formatting (src/native)
        run: bun run check:cpp
