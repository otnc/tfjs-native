name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback: lint/typecheck/pure tests, no native toolchain needed.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      TFJS_NATIVE_SKIP_INSTALL: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Biome check (src/, scripts/, configs — lint + format)
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      # Native-dependent tests skip themselves without a built addon.
      - name: Test (pure)
        run: bun test

  # Builds the addon against libtensorflow and runs the native integration tests.
  # macos-13 is intentional: the official libtensorflow C library has no arm64
  # build, so macos-latest (arm64) cannot link it.
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # node-gyp needs a real Node and a Python.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: bun install --frozen-lockfile
        env:
          TFJS_NATIVE_SKIP_INSTALL: "1"

      - name: Cache libtensorflow
        uses: actions/cache@v4
        with:
          path: deps/libtensorflow
          key: libtensorflow-${{ runner.os }}-${{ hashFiles('scripts/install.mjs') }}

      - name: Fetch libtensorflow
        run: node scripts/install.mjs

      - name: Build addon
        run: node node_modules/node-gyp/bin/node-gyp.js rebuild

      - name: Test (with native addon)
        run: bun test

  cpp-format:
    name: cpp-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv provides uvx, which runs the pinned clang-format (see check:cpp).
      - uses: astral-sh/setup-uv@v6

      - uses: oven-sh/setup-bun@v2

      - name: Check C++ formatting (src/native)
        run: bun run check:cpp
